<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubik's Cube Graph Solver</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --ink: #1d2433; --muted: #6b7488; --line: #dde2ec;
    --accent: #2f5bea; --accent-ink: #ffffff; --ring: #d5dae6; --explored: #c3c9d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
           justify-content: space-between; padding: 14px 16px; }
  h1 { font-size: 20px; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  select, button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled, select:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .panel { position: relative; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; height: min(58vh, 520px); min-height: 320px; overflow: hidden; }
  .panel h2 { position: absolute; top: 8px; left: 12px; margin: 0; font-size: 12px;
              text-transform: uppercase; letter-spacing: .06em; color: var(--muted); z-index: 2; }
  #cube, #graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { margin: 12px 16px 24px; padding: 12px 16px; background: var(--card);
           border: 1px solid var(--line); border-radius: 12px; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; }
  .status .muted { color: var(--muted); }
  .chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; }
  .chips .label { color: var(--muted); margin-right: 4px; }
  .chip { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
          background: #f6f8fc; font-variant-numeric: tabular-nums; transition: all .25s; }
  .chip.done { background: #e4e9f5; color: var(--muted); }
  .chip.current { background: var(--accent); color: #fff; border-color: var(--accent); }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; gap: 10px; background: rgba(255,255,255,.75); z-index: 3; }
  #overlay.on { display: flex; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
           background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0;
           pointer-events: none; transition: all .3s; max-width: 90vw; z-index: 10; }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    .panel { height: 46vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Rubik's Cube × Graph Theory</h1>
  <div class="controls">
    <label>Size
      <select id="size">
        <option>2</option><option selected>3</option><option>4</option><option>5</option>
      </select>
    </label>
    <button id="jumble">Jumble</button>
    <button id="solve" class="primary">Solve</button>
    <button id="reset">Reset</button>
  </div>
</header>

<main>
  <section class="panel"><h2>Cube</h2><div id="cube"></div>
    <div id="overlay"><div class="spinner"></div><div>Searching…</div></div></section>
  <section class="panel"><h2>State graph</h2><canvas id="graph"></canvas></section>
</main>

<footer>
  <div class="status">
    <span id="step">Ready</span>
    <span id="stats" class="muted"></span>
  </div>
  <div class="chips" id="chips"></div>
</footer>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";

// ---------- shared helpers ----------
const COLORS = { U: "#ffffff", D: "#ffd500", F: "#009b48", B: "#0046ad", R: "#b71234", L: "#ff5800" };
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function tween(ms, fn) {
  return new Promise(resolve => {
    const t0 = performance.now();
    (function frame(now) {
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      t < 1 ? requestAnimationFrame(frame) : resolve();
    })(t0);
  });
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("on"), 4000);
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
  return data;
}

// U-face colours of a state JSON, in top-down reading order (matches backend `u`).
function uFromState(state) {
  return state.stickers.filter(s => s.nm[1] === 1)
    .sort((a, b) => a.p[2] - b.p[2] || a.p[0] - b.p[0]).map(s => s.c);
}

// ---------- cube view (Three.js) ----------
const Cube = (() => {
  const host = $("cube");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.appendChild(renderer.domElement);
  renderer.domElement.style.cssText = "width:100%;height:100%;display:block";
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.5);
  sun.position.set(3, 5, 4);
  scene.add(sun);

  let root = null, meshes = [], cubies = [], n = 3;
  const black = new THREE.MeshLambertMaterial({ color: 0x14161c });

  function build(state) {
    if (root) scene.remove(root);
    root = new THREE.Group();
    scene.add(root);
    n = state.n; meshes = []; cubies = [];
    const byPos = new Map();
    const plane = new THREE.PlaneGeometry(0.84, 0.84);
    const box = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    state.stickers.forEach((s, i) => {
      const key = s.p.join(",");
      let cubie = byPos.get(key);
      if (!cubie) {
        cubie = new THREE.Group();
        cubie.userData.coord = s.p;
        cubie.position.set(...s.p.map(v => v * 0.5));
        cubie.add(new THREE.Mesh(box, black));
        root.add(cubie);
        byPos.set(key, cubie);
        cubies.push(cubie);
      }
      const m = new THREE.Mesh(plane, new THREE.MeshBasicMaterial({ color: COLORS[s.c] }));
      const nm = new THREE.Vector3(...s.nm);
      m.position.copy(nm).multiplyScalar(0.49);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nm);
      cubie.add(m);
      meshes[i] = m;
    });
    const d = n * 2.1 + 2;
    camera.position.set(d * 0.75, d * 0.65, d);
    controls.target.set(0, 0, 0);
    controls.update();
  }

  // Repaint every sticker from backend state, and reset all cubies to their home pose.
  function paint(state) {
    state.stickers.forEach((s, i) => meshes[i].material.color.set(COLORS[s.c]));
    cubies.forEach(c => {
      c.position.set(...c.userData.coord.map(v => v * 0.5));
      c.rotation.set(0, 0, 0);
    });
  }

  async function animateMove(move, ms) {
    const ai = "xyz".indexOf(move.axis);
    const pivot = new THREE.Group();
    root.add(pivot);
    const slice = cubies.filter(c => c.userData.coord[ai] === move.layer);
    slice.forEach(c => pivot.attach(c));
    await tween(ms, t => { pivot.rotation[move.axis] = t * move.q * Math.PI / 2; });
    slice.forEach(c => root.attach(c));
    root.remove(pivot);
  }

  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

  return { build, paint, animateMove, setIdle: idle => { controls.autoRotate = idle; } };
})();

// ---------- graph view (canvas 2D) ----------
const Graph = (() => {
  const canvas = $("graph");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, hover = null, mouse = null;
  let g = emptyGraph(null);

  function emptyGraph(u) {
    return { nodes: [{ id: 0, ring: 0, ang: 0, path: true, step: 0, u, born: 0 }],
             edges: [], total: 0, marker: 0, maxRing: 1, n: 3 };
  }

  const dominant = u => {
    if (!u) return "#ffffff";
    const c = {};
    u.forEach(x => c[x] = (c[x] || 0) + 1);
    return COLORS[Object.keys(c).sort((a, b) => c[b] - c[a])[0]];
  };

  // Lay out nodes by ring (distance) and angle. `ringOf(step)` gives a path node's ring.
  function layout(data, ringOf, marker, n) {
    const total = data.total, now = performance.now();
    const sweep = 1.7 * Math.PI, a0 = -Math.PI / 2;
    const nodes = data.nodes.map(nd => ({ ...nd }));
    nodes.filter(nd => nd.path).forEach(nd => {
      nd.ring = ringOf(nd.step);
      nd.ang = a0 + (total ? nd.step / total : 0) * sweep;
    });
    const kids = {};
    nodes.filter(nd => !nd.path).forEach(nd => (kids[nd.parent] = kids[nd.parent] || []).push(nd));
    Object.entries(kids).forEach(([pid, list]) => {
      const p = nodes[pid];
      list.forEach((nd, j) => {
        const outer = j % 2 === 0 || p.ring <= 1;
        nd.ring = outer ? p.ring + 1 : p.ring - 1;
        const off = (Math.floor(j / 2) + 1) * 0.14 * (j % 4 < 2 ? 1 : -1);
        nd.ang = p.ang + off;
      });
    });
    nodes.forEach(nd => { nd.born = now + nd.ring * 60 + (nd.path ? 0 : 200); });
    return { nodes, edges: data.edges, total, marker, n, maxRing: Math.max(1, ...nodes.map(x => x.ring)) };
  }

  function loadSolution(graph, n) { g = layout(graph, s => graph.total - s, 0, n); }

  // Chain of jumbled states, growing outward from the start; marker sits on the last one.
  function loadJumble(states, moves, n) {
    const data = {
      total: states.length - 1,
      nodes: states.map((st, i) => ({ id: i, u: uFromState(st), path: true, step: i })),
      edges: moves.map((m, i) => ({ a: i, b: i + 1, move: m, path: true })),
    };
    g = layout(data, s => s, states.length - 1, n);
  }

  function loadSingle(state) {
    g = emptyGraph(uFromState(state));
    g.n = state.n;
    g.nodes[0].born = performance.now();
  }

  function pos(nd) {
    const R = Math.max(10, Math.min(W, H) / 2 - 34), r = nd.ring / g.maxRing * R;
    return [W / 2 + r * Math.cos(nd.ang), H / 2 + r * Math.sin(nd.ang)];
  }

  const pathNode = i => g.nodes.find(nd => nd.path && nd.step === i);

  async function advanceTo(step, ms) {
    const from = g.marker;
    await tween(ms, t => { g.marker = from + (step - from) * t; });
    g.marker = step;
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(resize).observe(canvas);
  canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    mouse = [e.clientX - r.left, e.clientY - r.top];
  });
  canvas.addEventListener("mouseleave", () => { mouse = null; });

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    // rings
    ctx.lineWidth = 1; ctx.strokeStyle = "#d5dae6"; ctx.fillStyle = "#9aa3b6";
    ctx.font = "10px system-ui";
    const R = Math.max(10, Math.min(W, H) / 2 - 34);
    for (let r = 1; r <= g.maxRing; r++) {
      ctx.beginPath(); ctx.arc(W / 2, H / 2, r / g.maxRing * R, 0, 7); ctx.stroke();
    }
    const alpha = nd => Math.max(0, Math.min(1, (now - nd.born) / 400));
    const P = g.nodes.map(pos);

    // explored edges, then solution edges
    g.edges.filter(e => !e.path).forEach(e => {
      const a = Math.min(alpha(g.nodes[e.a]), alpha(g.nodes[e.b]));
      ctx.globalAlpha = a * 0.9; ctx.strokeStyle = "#c3c9d6"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(...P[e.a]); ctx.lineTo(...P[e.b]); ctx.stroke();
    });
    g.edges.filter(e => e.path).forEach((e, j) => {
      const prog = Math.max(0, Math.min(1, g.marker - j));
      const [ax, ay] = P[e.a], [bx, by] = P[e.b];
      ctx.globalAlpha = Math.min(alpha(g.nodes[e.a]), alpha(g.nodes[e.b]));
      ctx.strokeStyle = "#aeb8d4"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
      if (prog > 0) {
        ctx.strokeStyle = "#1d2433"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + (bx - ax) * prog, ay + (by - ay) * prog); ctx.stroke();
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        ctx.font = "bold 11px system-ui";
        const tw = ctx.measureText(e.move).width + 8;
        ctx.globalAlpha *= prog;
        ctx.fillStyle = "#fff"; ctx.strokeStyle = "#1d2433"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(mx - tw / 2, my - 8, tw, 16, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#1d2433"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(e.move, mx, my + 0.5);
      }
    });

    // nodes
    hover = null;
    g.nodes.forEach((nd, i) => {
      const [x, y] = P[i];
      const rad = nd.path ? 10 : 6;
      if (mouse && Math.hypot(mouse[0] - x, mouse[1] - y) <= rad + 3) hover = i;
      ctx.globalAlpha = alpha(nd);
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 7);
      ctx.fillStyle = dominant(nd.u); ctx.fill();
      const done = nd.path && nd.step <= g.marker + 1e-6;
      ctx.lineWidth = done ? 3 : 1.5;
      ctx.strokeStyle = nd.path ? (done ? "#1d2433" : "#7c87a3") : "#9aa3b6";
      ctx.stroke();
    });

    // marker with pulse
    const i0 = Math.min(Math.floor(g.marker), g.total), i1 = Math.min(i0 + 1, g.total);
    const a = pathNode(i0), b = pathNode(i1);
    if (a && b) {
      const [ax, ay] = pos(a), [bx, by] = pos(b), f = g.marker - i0;
      const pulse = 1 + 0.25 * Math.sin(now / 160);
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(ax + (bx - ax) * f, ay + (by - ay) * f, 16 * pulse, 0, 7);
      ctx.strokeStyle = "#2f5bea"; ctx.lineWidth = 3; ctx.stroke();
    }

    // hover tooltip: the node's U face
    if (hover !== null && g.nodes[hover].u) {
      const nd = g.nodes[hover], cs = 14, size = g.n * cs;
      let [x, y] = P[hover];
      x = Math.min(Math.max(x + 14, 4), W - size - 12); y = Math.min(Math.max(y + 14, 4), H - size - 12);
      ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.strokeStyle = "#1d2433"; ctx.lineWidth = 1;
      ctx.fillRect(x - 4, y - 4, size + 8, size + 8); ctx.strokeRect(x - 4, y - 4, size + 8, size + 8);
      nd.u.forEach((c, k) => {
        ctx.fillStyle = COLORS[c];
        ctx.fillRect(x + (k % g.n) * cs, y + Math.floor(k / g.n) * cs, cs - 1, cs - 1);
      });
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  return { loadSolution, loadJumble, loadSingle, advanceTo };
})();

// ---------- app ----------
const app = { n: 3, state: null, busy: false };
const ui = {
  size: $("size"), jumble: $("jumble"), solve: $("solve"), reset: $("reset"),
};

function setBusy(b) {
  app.busy = b;
  Object.values(ui).forEach(el => el.disabled = b);
  Cube.setIdle(!b);
}

function showChips(label, names, current = -1) {
  const el = $("chips");
  el.innerHTML = `<span class="label">${label}</span>`;
  names.forEach((nm, i) => {
    const c = document.createElement("span");
    c.className = "chip" + (i < current ? " done" : i === current ? " current" : "");
    c.textContent = nm;
    el.appendChild(c);
  });
}
function markChip(i) {
  [...$("chips").querySelectorAll(".chip")].forEach((c, j) => {
    c.className = "chip" + (j < i ? " done" : j === i ? " current" : "");
  });
}

async function loadSize(n) {
  const { state } = await api(`/api/cube?n=${n}`);
  app.n = n; app.state = state;
  Cube.build(state);
  Graph.loadSingle(state);
  $("step").textContent = "Ready"; $("stats").textContent = ""; $("chips").innerHTML = "";
}

async function guarded(fn) {
  if (app.busy) return;
  setBusy(true);
  try { await fn(); } catch (e) { toast(e.message); } finally { setBusy(false); $("overlay").classList.remove("on"); }
}

ui.size.addEventListener("change", () => guarded(() => loadSize(+ui.size.value)));
ui.reset.addEventListener("click", () => guarded(() => loadSize(app.n)));

ui.jumble.addEventListener("click", () => guarded(async () => {
  const res = await api("/api/scramble", { n: app.n, stickers: app.state.stickers });
  const states = [app.state], names = [];
  $("stats").textContent = "";
  showChips("Scramble:", res.steps.map(s => s.move.name));
  for (const [i, step] of res.steps.entries()) {
    markChip(i);
    $("step").textContent = `Jumble ${i + 1}/${res.steps.length} · move ${step.move.name}`;
    await Cube.animateMove(step.move, 300);
    Cube.paint(step.state);
    states.push(step.state); names.push(step.move.name);
  }
  app.state = states[states.length - 1];
  Graph.loadJumble(states, names, app.n);
  markChip(names.length);
  $("step").textContent = `Jumbled with ${names.length} moves`;
}));

ui.solve.addEventListener("click", () => guarded(async () => {
  $("step").textContent = "Searching…";
  $("overlay").classList.add("on");
  let res;
  try { res = await api("/api/solve", { n: app.n, stickers: app.state.stickers }); }
  finally { $("overlay").classList.remove("on"); }
  const total = res.steps.length;
  const s = res.stats;
  $("stats").textContent = `explored ${s.explored.toLocaleString()} states · ${s.seconds} s · depth ${s.length}`;
  if (!total) { $("step").textContent = "Already solved ✓"; return; }
  Graph.loadSolution(res.graph, app.n);
  showChips("Solution:", res.steps.map(x => x.move.name));
  for (const [i, step] of res.steps.entries()) {
    markChip(i);
    $("step").textContent = `Step ${i + 1}/${total} · move ${step.move.name}`;
    await Promise.all([Cube.animateMove(step.move, 600), Graph.advanceTo(i + 1, 600)]);
    Cube.paint(step.state);
    app.state = step.state;
    if (i < total - 1) await sleep(1000);
  }
  markChip(total);
  $("step").textContent = `Solved ✓ in ${total} moves`;
}));

guarded(() => loadSize(3));
</script>
</body>
</html>
